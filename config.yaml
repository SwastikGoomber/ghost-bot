models:
  chat: "gemini-3.1-flash-lite"
  vision: "gemini-2.0-flash"
  summary: "gemini-2.5-flash"
  router: "gemma4:e4b"             # Phase 5 - Gemma 4 local router via Ollama
  cone_approval: "gemma4:e4b"      # Phase 5 - Gemma 4 local cone approval agent via Ollama
  rag_planner: "gemma4:e4b"        # Phase 5 - Gemma 4 local RAG query planner via Ollama
  embedder: "mxbai-embed-large"    # Phase 4 - local embeddings via Ollama (1024 dimensions)
  extractor: "gemini-2.5-flash"    # Phase 4 - RAG extraction (batch mode, needs quality + long output)
  arc_summarizer: "gemini-2.5-flash" # Phase 4 - arc summary generation

gemini:
  chat:
    temperature: 0.9
    top_p: 0.7
    max_output_tokens: 1000
  vision:
    temperature: 0.7
    top_p: 0.8
    max_output_tokens: 500
  summary:
    temperature: 0.3
    top_p: 0.9
    max_output_tokens: 500
  extraction:
    temperature: 0.1   # Low temp for structured JSON output — consistency matters here
    top_p: 0.9
    max_output_tokens: 65536  # Batch mode: entire run in one call, may output thousands of tokens
  arc_summary:
    temperature: 0.5
    top_p: 0.9
    max_output_tokens: 1500

ollama:
  router:
    temperature: 0.1  # Low temp — this is classification, not creativity
    num_predict: 256  # Small JSON but Gemma may emit preamble tokens before it
  rag_planner:
    temperature: 0.2
    num_predict: 1024  # RetrievalQuery JSON can be moderately large
  cone_approval:
    temperature: 0.2
    num_predict: 2048  # Gemma 4 E4B thinking tokens count toward this limit; needs headroom

memory:
  message_history_limit: 15
  summary_trigger_count: 50
  messages_kept_after_summary: 30

cone:
  default_duration_minutes: 30
  max_duration_hours: 24
  permissions:
    - "lillyyen"
    - "puckz"
    - "river333"
    - "dulcibel"
    - "yostiiii"
  # Programmatic gate thresholds (Tier 0)
  per_target_cooldown_minutes: 20   # Min time between cones on the same target
  hourly_limit: 10                  # Max total cones applied in any rolling 60-min window
  autonomous_max_per_day: 5         # Hard cap on Ghost-initiated autonomous cones per day

bot:
  name: "Ghost"
  name_triggers:
    - "ghost"
    - "ghosty"
  daily_request_limit: 200
  minute_request_limit: 20
  nap_durations:
    50: 5
    100: 10
    150: 15

discord:
  max_message_length: 2000
  authorized_slash_user_ids:
    - 584379536108552246
    - 209422949009195008
    - 939512133350211625
    - 145297670242566144
    - 1394673202265063484

twitch:
  max_message_length: 500

rag:
  enabled: true                # Set to true once Ollama + nomic-embed-text is running
  enable_twitch_retrieval: false # Twitch chat usually moves too fast for lore retrieval
  enabled_channel_ids: []       # Add Discord channel IDs to ingest here

  # Ingestion schedule — daily at 6:00 AM IST (00:30 UTC)
  # APScheduler cron format: second minute hour day month day_of_week
  extraction_cron: "0 30 0 * * *"
  extraction_lookback_hours: 24

  # Extraction thresholds
  min_message_length_words: 5    # Skip messages shorter than this
  conversation_gap_minutes: 10   # Time gap that splits a segment into two

  # Arc summary triggers (checked after each ingestion run)
  arc_summary_token_threshold: 4000  # Approx tokens across arc chunks before summarising
  arc_closure_gap_days: 5            # Days without new chunks before arc is considered closed

  # Retrieval
  retrieval_top_k: 5
  vector_weight: 0.6             # Weight for cosine similarity in final score
  significance_weight: 0.4       # Weight for significance score in final score
  min_significance_filter: 1     # Exclude chunks below this significance
  post_filter_disabled: false    # Set to true to skip $match post-filter (debug only)

  # Suggested tag review queue (MongoDB collection name)
  suggested_tag_collection: "rag_suggested_tags"
