[project]
name = "ghost-bot"
version = "2.0.0"
description = "Ghost Bot v2 — persistent cross-platform roleplay chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Platform clients
    "discord-py>=2.0.0",
    "twitchio>=2.6.0",
    # LLM providers
    "google-genai>=1.75.0",
    # Database
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    # HTTP
    "aiohttp>=3.8.0",
    # Data validation & config
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    # Environment
    "python-dotenv>=0.19.0",
    # Advanced cone effects (spaCy-powered)
    "spacy>=3.4.0,<4.0.0",
    "nltk>=3.8.0",
    "textblob>=0.17.0",
    # Job scheduling (RAG ingestion)
    "apscheduler>=3.10.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
